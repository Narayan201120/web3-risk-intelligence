name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Build runtime container
        run: docker build --tag web3-risk-intelligence:ci .

      - name: Run tests in runtime container
        run: docker run --rm --entrypoint python web3-risk-intelligence:ci -m pytest -q
